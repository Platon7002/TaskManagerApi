spring.application.name=task-manager-api
server.port=8080

# База данных H2 хранится в памяти: при каждом запуске чистая
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Стрим (SSE) может идти дольше стандартных 30 секунд
spring.mvc.async.request-timeout=5m

# Русский текст в ответах
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
